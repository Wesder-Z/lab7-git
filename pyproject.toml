[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab7-sql-databases"
version = "1.0.0"
description = "Лабораторная работа №7 по работе с СУБД"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
